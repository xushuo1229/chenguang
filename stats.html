<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据统计 · 晨光自律台</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="css/variables.css" as="style">
  <link rel="preload" href="css/shared.css" as="style">

  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/shared.css">
  <style>
    body { display: flex; min-height: 100vh; }
    /* ===== 主内容 ===== */
    .main {
      flex: 1;
      padding: 24px 28px 40px;
      max-width: 960px;
      overflow-y: auto;
    }

    .topbar .greeting h2 {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .topbar .greeting h2 span {
      color: var(--primary);
    }

    .topbar .greeting .date {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .topbar .actions {
      display: flex;
      gap: 10px;
    }

    .topbar .actions a {
      background: var(--bg-card);
      padding: 8px 18px;
      border-radius: 40px;
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(0,212,255,0.15);
      transition: 0.2s;
    }

    .topbar .actions a:hover {
      border-color: var(--primary);
      background: #fdfaf5;
    }

    .topbar .actions a i {
      margin-right: 4px;
    }

    /* ===== KPI 卡片 ===== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .kpi-card {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid rgba(0,212,255,0.15);
      text-align: center;
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }

    .kpi-card:hover {
      border-color: rgba(0,212,255,0.3);
      box-shadow: 0 4px 16px rgba(0,212,255,0.04);
    }

    .kpi-card .kpi-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,212,255,0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .kpi-card .kpi-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .kpi-card .kpi-label {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* KPI 卡片颜色区分 */
    .kpi-card:nth-child(1) { --kpi-color: var(--primary); }
    .kpi-card:nth-child(2) { --kpi-color: var(--success); }
    .kpi-card:nth-child(3) { --kpi-color: #8b5cf6; }
    .kpi-card:nth-child(4) { --kpi-color: var(--info); }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: var(--kpi-color, var(--primary));
      border-radius: 2px;
    }

    /* KPI 入场动画 */
    @keyframes kpiReveal {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .kpi-card { animation: kpiReveal 0.5s ease backwards; }
    .kpi-card:nth-child(1) { animation-delay: 0.05s; }
    .kpi-card:nth-child(2) { animation-delay: 0.1s; }
    .kpi-card:nth-child(3) { animation-delay: 0.15s; }
    .kpi-card:nth-child(4) { animation-delay: 0.2s; }

    /* ===== 图表区域 ===== */
    .chart-section {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(0,212,255,0.15);
      margin-bottom: 20px;
    }

    .chart-section .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-section .chart-header h3 {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 260px;
    }

    .chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* 图表卡片装饰 */
    .chart-section {
      position: relative;
      overflow: hidden;
    }
    .chart-section::before {
      content: '';
      position: absolute;
      top: -50%; right: -50%;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(0,212,255,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    /* 图表标题装饰 */
    .chart-header h3 {
      position: relative;
      padding-left: 12px;
    }
    .chart-header h3::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 18px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* ===== 热力图 ===== */
    .heatmap-section {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(0,212,255,0.15);
      margin-bottom: 20px;
    }

    .heatmap-section .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .heatmap-section .chart-header h3 {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hm-container { overflow-x: auto; padding: 4px 0; }

    .hm-months {
      display: grid;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .hm-body { display: flex; gap: 4px; }

    .hm-weekdays {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.65rem;
      color: var(--text-muted);
      padding-right: 4px;
    }

    .hm-weekdays span {
      height: 13px;
      display: flex;
      align-items: center;
    }

    .hm-grid {
      display: flex;
      gap: 3px;
    }

    .hm-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .hm-cell {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .hm-cell:hover {
      transform: scale(1.3);
      box-shadow: 0 0 8px rgba(0,212,255,0.4);
    }

    .hm-empty { background: transparent; }

    /* 热力图改用琥珀色调 */
    .hm-level-0 { background: #1a1a2e; }
    .hm-level-1 { background: rgba(0,212,255,0.15); }
    .hm-level-2 { background: rgba(0,212,255,0.35); }
    .hm-level-3 { background: var(--neon-blue); }
    .hm-level-4 { background: var(--neon-blue); }

    .hm-legend {
      display: flex;
      align-items: center;
      gap: 3px;
      justify-content: flex-end;
      margin-top: 10px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .hm-legend .hm-cell {
      width: 13px;
      height: 13px;
    }

    /* ===== 刷新按钮 ===== */
    .refresh-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid rgba(0,212,255,0.15);
      background: var(--bg-card);
      color: var(--text-dark);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-refresh:hover {
      border-color: var(--primary);
      background: #fdfaf5;
    }

    .btn-refresh:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-refresh i {
      font-size: 0.9rem;
    }

    .btn-refresh:active { transform: rotate(180deg) scale(0.9); }
    .btn-refresh.spinning { animation: spin 0.8s ease; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ===== Toast 容器 ===== */
    #toastContainer {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 640px) {
      .main { padding: 16px; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .chart-wrap { height: 220px; }
      .topbar .greeting h2 { font-size: 1.1rem; }
    }

    @media (max-width: 400px) {
      .kpi-grid { grid-template-columns: 1fr; }
      .topbar .actions a { padding: 6px 12px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

    <a href="workbench.html?view=manage" class="nav-item" data-nav="manage"><i class="fas fa-cog"></i>管理</a>

  </div>

<!-- ===== 主内容 ===== -->
<main class="main">

  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="greeting">
      <h2>📈 数据统计 <span id="welcomeName"></span></h2>
      <div class="date" id="welcomeDate"></div>
    </div>
    <div class="actions">
      <a href="workbench.html" class="nav-link" data-nav="back"><i class="fas fa-arrow-left"></i> 返回工作台</a>
    </div>
  </div>

  <!-- 刷新按钮 -->
  <div class="refresh-bar">
    <button class="btn-refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i> 刷新数据</button>
  </div>

  <!-- ===== KPI 概览卡片 ===== -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-icon">🔥</div>
      <div class="kpi-value" id="kpiStreak">0</div>
      <div class="kpi-label">最长连续打卡（天）</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">✅</div>
      <div class="kpi-value" id="kpiCheckins">0</div>
      <div class="kpi-label">累计打卡次数</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">📊</div>
      <div class="kpi-value" id="kpiRate">0%</div>
      <div class="kpi-label">课程完成率</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon">⏱️</div>
      <div class="kpi-value" id="kpiStudy">0</div>
      <div class="kpi-label">总学习时长（小时）</div>
    </div>
  </div>

  <!-- ===== 每周趋势图 ===== -->
  <div class="chart-section">
    <div class="chart-header">
      <h3><i class="fas fa-chart-line"></i> 每周趋势</h3>
    </div>
    <div class="chart-wrap">
      <canvas id="weeklyChart"></canvas>
    </div>
  </div>

  <!-- ===== 课程完成情况 ===== -->
  <div class="chart-section">
    <div class="chart-header">
      <h3><i class="fas fa-chart-pie"></i> 课程完成情况</h3>
    </div>
    <div class="chart-wrap" style="height:280px;">
      <canvas id="completionChart"></canvas>
    </div>
  </div>

  <!-- ===== 30天学习时长 ===== -->
  <div class="chart-section">
    <div class="chart-header">
      <h3><i class="fas fa-chart-bar"></i> 30天学习时长</h3>
    </div>
    <div class="chart-wrap">
      <canvas id="studyChart"></canvas>
    </div>
  </div>

  <!-- ===== GitHub 风格热力图 ===== -->
  <div class="heatmap-section">
    <div class="chart-header">
      <h3><i class="fas fa-fire"></i> 年度活跃热力图</h3>
    </div>
    <div id="heatmapContainer"></div>
  </div>

</main>
