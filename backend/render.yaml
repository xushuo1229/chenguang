services:
  - type: web
    name: chenguang-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chenguang-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
        value: https://your-frontend.vercel.app

databases:
  - name: chenguang-db
    plan: free
    databaseName: chenguang
