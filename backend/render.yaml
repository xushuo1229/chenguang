services:
  - type: web
    name: chenguang-backend
    runtime: node
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    disk:
      name: chenguang-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/chenguang.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
