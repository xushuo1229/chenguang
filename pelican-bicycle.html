<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#87CEEB;overflow:hidden}</style>
</head>
<body>
<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/><stop offset="100%" stop-color="#87CEEB"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/><stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF9C4"/><stop offset="100%" stop-color="#FFC107"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="700" cy="60" r="40" fill="url(#sun)">
    <animate attributeName="r" values="40;43;40" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云朵 -->
  <g opacity="0.8">
    <ellipse cx="100" cy="50" rx="50" ry="25" fill="white"/>
    <ellipse cx="130" cy="45" rx="40" ry="20" fill="white"/>
    <ellipse cx="70" cy="55" rx="35" ry="18" fill="white"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;60,0;0,0" dur="20s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="400" cy="80" rx="60" ry="22" fill="white"/>
    <ellipse cx="440" cy="75" rx="45" ry="18" fill="white"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;80,0;0,0" dur="25s" repeatCount="indefinite"/>
  </g>

  <!-- 草地 -->
  <rect x="0" y="320" width="800" height="80" fill="url(#grass)"/>
  <g fill="#66BB6A" opacity="0.6">
    <polygon points="50,320 55,290 60,320"/><polygon points="120,320 125,285 130,320"/>
    <polygon points="250,320 255,295 260,320"/><polygon points="380,320 385,288 390,320"/>
    <polygon points="500,320 505,292 510,320"/><polygon points="620,320 625,286 630,320"/>
    <polygon points="730,320 735,298 740,320"/>
  </g>

  <!-- ===== 自行车 ===== -->
  <g id="bicycle">
    <!-- 后轮 -->
    <circle cx="250" cy="300" r="55" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="250" cy="300" r="8" fill="#555"/>
    <g id="back-spoke">
      <line x1="250" y1="300" x2="250" y2="250" stroke="#888" stroke-width="1.5"/>
      <line x1="250" y1="300" x2="305" y2="300" stroke="#888" stroke-width="1.5"/>
      <line x1="250" y1="300" x2="250" y2="350" stroke="#888" stroke-width="1.5"/>
      <line x1="250" y1="300" x2="195" y2="300" stroke="#888" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 300" to="360 250 300" dur="1.5s" repeatCount="indefinite"/>
    </g>

    <!-- 前轮 -->
    <circle cx="470" cy="300" r="55" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="470" cy="300" r="8" fill="#555"/>
    <g id="front-spoke">
      <line x1="470" y1="300" x2="470" y2="250" stroke="#888" stroke-width="1.5"/>
      <line x1="470" y1="300" x2="525" y2="300" stroke="#888" stroke-width="1.5"/>
      <line x1="470" y1="300" x2="470" y2="350" stroke="#888" stroke-width="1.5"/>
      <line x1="470" y1="300" x2="415" y2="300" stroke="#888" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0 470 300" to="360 470 300" dur="1.5s" repeatCount="indefinite"/>
    </g>

    <!-- 车架 -->
    <line x1="280" y1="260" x2="370" y2="220" stroke="#C62828" stroke-width="3.5"/>
    <line x1="370" y1="220" x2="440" y2="260" stroke="#C62828" stroke-width="3.5"/>
    <line x1="280" y1="260" x2="280" y2="200" stroke="#C62828" stroke-width="3.5"/>
    <line x1="280" y1="200" x2="440" y2="260" stroke="#C62828" stroke-width="3.5"/>
    <line x1="250" y1="300" x2="280" y2="260" stroke="#C62828" stroke-width="3"/>
    <line x1="470" y1="300" x2="440" y2="260" stroke="#C62828" stroke-width="3"/>

    <!-- 座椅 -->
    <ellipse cx="370" cy="215" rx="18" ry="7" fill="#2E7D32"/>

    <!-- 把手 -->
    <line x1="440" y1="260" x2="440" y2="230" stroke="#333" stroke-width="3"/>
    <line x1="420" y1="235" x2="460" y2="235" stroke="#333" stroke-width="3"/>
    <circle cx="440" cy="230" r="5" fill="#555"/>

    <!-- 脚踏板 -->
    <circle id="pedal-left" cx="280" cy="200" r="8" fill="#555"/>
    <line x1="280" y1="200" x2="280" y2="185" stroke="#555" stroke-width="2"/>
    <circle id="pedal-right" cx="370" cy="220" r="8" fill="#555"/>
    <line x1="370" y1="220" x2="370" y2="205" stroke="#555" stroke-width="2"/>
    <animateTransform attributeName="transform" type="rotate" from="0 325 210" to="360 325 210" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g id="pelican">
    <!-- 身体（动态位移模拟骑行上下颠簸） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0;0,2;0,0" dur="1.5s" repeatCount="indefinite"/>

      <!-- 尾巴 -->
      <polygon points="230,255 200,245 205,260 195,260 210,250" fill="#D84315" opacity="0.7"/>

      <!-- 身体 -->
      <ellipse cx="280" cy="250" rx="45" ry="30" fill="#F5A623"/>
      <ellipse cx="275" cy="248" rx="40" ry="25" fill="#FFB74D" opacity="0.5"/>

      <!-- 翅膀 -->
      <g>
        <path d="M245,240 Q220,210 230,185 Q240,200 255,225 Z" fill="#E65100">
          <animate attributeName="d" values="M245,240 Q220,210 230,185 Q240,200 255,225 Z;M245,240 Q215,220 225,195 Q235,210 255,225 Z;M245,240 Q220,210 230,185 Q240,200 255,225 Z" dur="0.8s" repeatCount="indefinite"/>
        </path>
        <path d="M250,250 Q230,230 238,215 Q245,228 258,245 Z" fill="#FF8F00" opacity="0.6">
          <animate attributeName="d" values="M250,250 Q230,230 238,215 Q245,228 258,245 Z;M250,250 Q225,240 233,225 Q240,235 258,245 Z;M250,250 Q230,230 238,215 Q245,228 258,245 Z" dur="0.8s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- 头颈 -->
      <path d="M315,235 Q335,220 350,210 Q358,205 365,208" stroke="#F5A623" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M315,235 Q335,220 350,210 Q358,205 365,208" stroke="#FFB74D" stroke-width="8" fill="none" stroke-linecap="round"/>

      <!-- 头 -->
      <circle cx="370" cy="210" r="18" fill="#F5A623"/>

      <!-- 嘴 -->
      <g>
        <path d="M385,208 L440,205 L388,225 Z" fill="#E65100">
          <animate attributeName="d" values="M385,208 L440,205 L388,225 Z;M385,208 L445,203 L388,225 Z;M385,208 L440,205 L388,225 Z" dur="0.6s" repeatCount="indefinite"/>
        </path>
        <path d="M386,212 L438,210 L388,224 Z" fill="#FF9800" opacity="0.5"/>
        <!-- 嘴尖红色部分 -->
        <path d="M430,204 L440,205 L430,212 Z" fill="#D32F2F"/>
      </g>

      <!-- 眼睛 -->
      <circle cx="362" cy="203" r="5" fill="white"/>
      <circle cx="363" cy="203" r="3" fill="#1A1A1A"/>
      <circle cx="364" cy="202" r="1" fill="white"/>

      <!-- 胸羽 -->
      <path d="M295,248 Q305,235 320,238 Q310,245 295,250 Z" fill="#FFCC80" opacity="0.4"/>

      <!-- 腿 -->
      <g>
        <!-- 左腿 -->
        <line x1="275" y1="278" x2="265" y2="310" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
        <circle cx="265" cy="312" r="4" fill="#E65100"/>
        <!-- 右腿 -->
        <line x1="290" y1="278" x2="300" y2="310" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
        <circle cx="300" cy="312" r="4" fill="#E65100"/>
      </g>
    </g>
  </g>

  <!-- ===== 背景装饰 ===== -->
  <!-- 远处山丘 -->
  <path d="M0,320 Q100,260 200,290 Q300,240 400,280 Q500,230 600,270 Q700,240 800,290 L800,320 Z" fill="#A5D6A7" opacity="0.5"/>
  <path d="M0,320 Q150,280 300,300 Q450,260 600,290 Q700,270 800,310 L800,320 Z" fill="#81C784" opacity="0.4"/>

  <!-- 小花 -->
  <g fill="#FFEB3B" opacity="0.8">
    <circle cx="150" cy="315" r="3"/><circle cx="150" cy="315" r="1.5" fill="#FFF176"/>
    <circle cx="320" cy="318" r="3"/><circle cx="320" cy="318" r="1.5" fill="#FFF176"/>
    <circle cx="550" cy="314" r="3"/><circle cx="550" cy="314" r="1.5" fill="#FFF176"/>
    <circle cx="680" cy="316" r="3"/><circle cx="680" cy="316" r="1.5" fill="#FFF176"/>
    <circle cx="750" cy="313" r="3"/><circle cx="750" cy="313" r="1.5" fill="#FFF176"/>
  </g>

  <!-- 前景草丛 -->
  <g fill="#4CAF50" opacity="0.3">
    <polygon points="10,320 15,290 20,320"/><polygon points="30,320 34,295 38,320"/>
    <polygon points="770,320 775,292 780,320"/><polygon points="790,320 794,298 798,320"/>
  </g>

  <!-- 移动的小鸟 -->
  <g>
    <ellipse cx="0" cy="0" rx="8" ry="4" fill="#333" transform="translate(500,100)"/>
    <ellipse cx="0" cy="0" rx="6" ry="3" fill="#333" transform="translate(520,95) rotate(30)"/>
    <animateTransform attributeName="transform" type="translate" values="-50,0;850,0" dur="15s" repeatCount="indefinite"/>
  </g>
</svg>
</body>
</html>
